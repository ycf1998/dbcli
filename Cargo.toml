[package]
name = "dbcli"
version = "1.0.0"
edition = "2024"
description = "MySQL CLI 工具，输出 JSON，支持权限分级"
authors = ["money"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
mysql = "25"
anyhow = "1"
sqlparser = { version = "0.62.0", features = ["visitor"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
