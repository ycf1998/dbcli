[package]
name = "dbcli"
version = "1.0.0"
edition = "2024"
description = "MySQL CLI 工具，输出 JSON，支持权限分级"
authors = ["money"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
mysql = "25"
anyhow = "1"
